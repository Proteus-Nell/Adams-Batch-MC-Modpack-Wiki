[ElderSoul]
	#Master enable. When false the skill can never be acquired.
	enabled = true
	#Max EP required to evolve Ancient Soul into Elder Soul.
	epAcquirement = 100000.0
	#Total boss kills required (Tensura bossesCounter bosses + world calamities).
	bossKillsRequired = 5
	#Magicule drained per tick while the aura is toggled on (Ancient Soul is 2).
	magiculeDrainPerTick = 4.0
	#Ally-buff aura radius in blocks (Ancient Soul is 25).
	buffRadius = 40.0
	#Ally-buff aura radius when mastered.
	buffRadiusMastered = 50.0
	#Soul Sight ESP radius in blocks for the holder (covers the mastered aura).
	soulSightRadius = 50.0
	#Aura Strength amplifier (2 = Strength III).
	strengthAmplifier = 2
	#Aura Regeneration amplifier (2 = Regeneration III).
	regenAmplifier = 2
	#Aura Resistance amplifier (1 = Resistance II; Ancient Soul gives I).
	resistanceAmplifier = 1
