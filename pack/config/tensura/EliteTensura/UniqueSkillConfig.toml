[Hecate]
	#In-slot passive: multiplier applied to every spell's magicule cost (0.0 = floored to free/minimum). Blacklisted spells (see costFloorBlacklist) keep their normal cost.
	inSlotCostMultiplier = 0.1
	#Spell registry IDs excluded from the in-slot cost floor (kept at full cost).
	costFloorBlacklist = ["tensura:reincarnation"]
	#Magicule drained per tick while the toggle is active.
	magiculeCostPerTick = 50.0
	#Bonus learning gain (ADD_VALUE) while toggled.
	learningPoint = 1.0
	#Bonus mastery gain (ADD_VALUE) while toggled.
	masteryPoint = 1.0
	#In-slot passive: flat bonus to learning-point gain for Magic (spells) only, always active while Hecate is slotted (stacks with the toggle's learningPoint bonus).
	passiveLearningBonus = 1.0
	#In-slot passive: flat bonus to mastery-point gain for Magic (spells) only, always active while Hecate is slotted (stacks with the toggle's masteryPoint bonus).
	passiveMasteryBonus = 1.0
	#Flat bonus damage added to all spell (magic) damage while toggled.
	spellDamageBonus = 30.0
	#Flat bonus spell damage while toggled, when Hecate is mastered.
	spellDamageBonusMastered = 75.0

[Brain]
	#Log Brain's per-evaluation AI decisions to the server console/log (skills toggled, skills pressed, magic buckets, cast attempts and why a cast did/didn't fire). Off by default — turn on to diagnose why a mob isn't using its abilities.
	debug = false
	#Number of skill-tick passes between Brain evaluations. ManasCore ticks passive skills every 100 game ticks (~5 seconds), so 1 = evaluate every ~5s (default), 2 = ~10s, etc. This is NOT in game ticks — the native passive-tick cadence is the floor.
	evalInterval = 1
	#Health fraction (0-1) below which the mob is treated as hurt: prioritises recovery magic and enables pressing active skills defensively.
	lowHealthFraction = 0.5

[Stillness]
	#Master enable. When false the skill can never be acquired.
	enabled = true
	#Max EP required to evolve Meditation into Stillness.
	epAcquirement = 50000.0
	#Total boss kills required (Tensura bossesCounter bosses + world calamities).
	bossKillsRequired = 3
	#Magicule drained per tick while Serenity is toggled on.
	magiculeCost = 30.0
	#Aura/magicule/SHP regeneration added while Serenity is active (Meditation is 0.5).
	regenRate = 1.0
	#Serenity regeneration when mastered.
	regenRateMastered = 1.5
	#Inner Calm: percent of MAX magicule and aura restored instantly (0-100).
	restorePercent = 25.0
	#Inner Calm restore percent when mastered.
	restorePercentMastered = 40.0
	#Inner Calm cooldown in SECONDS.
	calmCooldownSeconds = 300
	#Inner Calm cooldown in SECONDS when mastered.
	calmCooldownMasteredSeconds = 180

