[AetherforgedSpear]
	#Master toggle for the Piercing Vector active.
	enabled = true
	#Aura cost on release.
	auraCost = 300.0
	#Magicule cost on release.
	magiculeCost = 300.0
	#Cooldown in game ticks (160 = 8s).
	cooldown = 160
	#Hold ticks for a full charge (30 = 1.5s).
	fullChargeTicks = 30
	#Minimum hold ticks before release fires at all (10 = 0.5s).
	minChargeTicks = 10
	#Damage = ATTACK_DAMAGE * factor, scaled min->max by charge fraction.
	minDamageFactor = 1.5
	maxDamageFactor = 3.0
	#Forward lunge velocity scale at full charge.
	lungeStrength = 1.6
	#Hit-scan reach of the released thrust, in blocks.
	strikeRange = 6.0
	#If true, Piercing Vector also hits players in the user's own nation or hunt party.
	friendlyFire = false

[AetherforgedKatana]
	#Master toggle for the Phase Cut active.
	enabled = true
	#Aura cost when arming the cut.
	auraCost = 250.0
	#Magicule cost when arming the cut.
	magiculeCost = 250.0
	#Cooldown in game ticks (200 = 10s), starts when armed.
	cooldown = 200
	#Window in game ticks during which the next hit phases (100 = 5s).
	windowTicks = 100
	#Bonus phase damage = ATTACK_DAMAGE * this factor, dealt armor-bypassing.
	bonusFactor = 0.5

