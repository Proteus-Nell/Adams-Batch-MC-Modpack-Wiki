[VoidEdgeWeapon]
	#Master toggle for all three Void Edge weapon abilities.
	enabled = true
	#Whether Void Edge abilities announce via Voice of the World.
	useVoiceOfTheWorld = false
	#Spatial Cut: damage = ATTACK_DAMAGE * this factor + flat.
	spatialDamageFactor = 1.5
	spatialDamageFlat = 30.0
	#Spatial Cut: line length in blocks (passes through walls).
	spatialRange = 24.0
	#Spatial Cut: hit radius around each point of the line.
	spatialRadius = 1.5
	#Spatial Cut: cooldown in ticks.
	spatialCooldown = 40
	#Spatial Cut: aura cost.
	spatialAuraCost = 200.0
	#Spatial Cut: magicule cost.
	spatialMagiculeCost = 200.0
	#Teleport Slash: max target range in blocks.
	teleportRange = 20.0
	#Teleport Slash: damage = ATTACK_DAMAGE * factor + flat.
	teleportDamageFactor = 1.5
	teleportDamageFlat = 40.0
	#Teleport Slash: damage multiplier when the target carries a Dimensional Mark.
	teleportMarkBonus = 1.5
	#Teleport Slash: invulnerability frames (ticks) granted on arrival.
	teleportInvulnTicks = 15
	#Teleport Slash: delay (ticks) before the follow-up slash lands.
	teleportSlashDelay = 5
	#Teleport Slash: cooldown in ticks.
	teleportCooldown = 80
	#Teleport Slash: aura cost.
	teleportAuraCost = 300.0
	#Teleport Slash: magicule cost.
	teleportMagiculeCost = 100.0
	#Reality Fracture: damage = ATTACK_DAMAGE * factor + flat.
	fractureDamageFactor = 2.0
	fractureDamageFlat = 80.0
	#Reality Fracture: AOE radius in blocks.
	fractureRadius = 6.0
	#Reality Fracture: max cast range when targeting a look point.
	fractureCastRange = 20.0
	#Reality Fracture: cooldown in ticks.
	fractureCooldown = 600
	#Reality Fracture: magicule cost.
	fractureMagiculeCost = 3000.0
	#Reality Fracture: aura cost.
	fractureAuraCost = 3000.0
	#Fractured Reality debuff duration (ticks) applied to caught targets.
	fractureDebuffDuration = 200
	#Fractured Reality debuff amplifier (0 = level I).
	fractureDebuffAmplifier = 1
	#Fractured Reality: Void damage dealt per second, scaled by (amplifier+1).
	fractureTickDamage = 8.0
	#Fractured Reality: incoming-damage multiplier on afflicted targets.
	fractureDamageTakenMultiplier = 1.25
	#Fractured Reality: movement-speed modifier (negative = slow), ADD_MULTIPLIED_TOTAL.
	fractureSlow = -0.3
	#Dimensional Mark duration (ticks) applied by Spatial Cut.
	markDuration = 120
	#Combo window (ticks) linking Spatial -> Teleport -> Fracture.
	comboWindow = 100
	#Reality Fracture radius multiplier when chained from a recent Teleport Slash.
	comboRadiusBonus = 1.5
	#Reality Fracture damage multiplier when the full resonance combo lands.
	resonanceDamageBonus = 1.5
	#If true, Spatial Cut and Reality Fracture also hit players in the wielder's own nation or hunt party.
	friendlyFire = false

