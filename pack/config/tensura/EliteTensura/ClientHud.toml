#Hide the FTB Chunks minimap while the Ultimate Banking System smartphone overlay is open (no effect without UBS). DEFAULT: true
hideMinimapWhilePhoneOpen = true
#Draw other players' showcase titles above their nameplates. Local only — the server can still disable the feature. DEFAULT: true
showPlayerTitles = true
#Show the gear cooldown panel (Aetherforged weapons, Void Edge, Astral Edge). DEFAULT: true
showGearCooldowns = true
#Show the hunt-party member frames (HP + direction/distance). DEFAULT: true
showPartyFrames = true
#Tint enemy-nation claims and pin Nation Cores on the FTB Chunks map and minimap. Local only — the server can still disable the feature. DEFAULT: true
showWarOverlay = true
#Show the Starfall foreshadow wedge and impact pin on the FTB Chunks map and minimap. Local only — the server can still disable the feature. DEFAULT: true
showStarfallMarkers = true

[MAGICULE_HUD]
	#Anchor point: TOP_LEFT, TOP_CENTER, TOP_RIGHT, MIDDLE_LEFT, MIDDLE_CENTER, MIDDLE_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER or BOTTOM_RIGHT.
	corner = "TOP_RIGHT"
	#Horizontal offset in pixels from the anchor (signed shift from center for *_CENTER).
	offsetX = 4
	#Vertical offset in pixels from the anchored screen edge (signed shift from center for MIDDLE_*).
	offsetY = 4

[VOID_EDGE_HUD]
	#Anchor point: TOP_LEFT, TOP_CENTER, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER or BOTTOM_RIGHT.
