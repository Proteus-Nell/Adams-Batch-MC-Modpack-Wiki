name: Sync the Wiki tab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render pages
        run: python -m tools.wikigen.render --data data --docs docs --content content --pack pack
      - name: Convert docs/ into wiki pages
        run: >
          python -m tools.wikigen.wiki_sync --docs docs --out wiki-out
          --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Push to the wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo; then
            echo "::error::The Wiki tab isn't initialised yet. Open https://github.com/${{ github.repository }}/wiki, create any first page, then re-run this workflow."
            exit 1
          fi
          rsync -a --delete --exclude .git wiki-out/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -q -m "Sync wiki from ${GITHUB_SHA::7}"
            git push
          fi
